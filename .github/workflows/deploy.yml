name: Deploy site to GitHub Pages

# ワークフローはリポジトリルートの .github/ にしか置けない（site/ 配下に置くと GitHub は見ない）。
# main への push（site/ と本ファイル）で再デプロイする。docs/ や stack.json の更新では再デプロイしない。
# 初回は GitHub の Settings → Pages → Source を "GitHub Actions" にしておく必要がある。
# 公開先: https://shuji-bonji.github.io/s1000d-stack/

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 は Node >= 22.23.4 を要求する
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          # action の input は working-directory の影響を受けないので、ルートからの相対で書く
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
